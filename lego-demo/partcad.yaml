name: //pub/universe/lego/lego-demo
desc: |
  Building LEGO assemblies with the PartCAD ASSY file format.

  The LDraw parts served by //pub/universe/lego already carry the LEGO
  interfaces (attached by the ldraw_repo plugin): stud / anti-stud on every
  rectangular Brick, Plate and Tile, and the Technic pin, pin hole, axle and
  axle hole on the Technic bricks, beams, pins and axles. These assemblies
  therefore reference the original LDraw parts directly and join them purely
  through those interfaces with `connect:` - no hand-placed coordinates, no
  local part definitions.

  Run pc from the repository root and address these assemblies as
  lego-demo:<name>.

assemblies:
  # Two 2x4 bricks mated stud->anti-stud, perfectly aligned (a column two
  # brick-heights tall).
  stack:
    type: assy
    path: stack.assy
    manufacturable: false

  # Four 1x4 bricks, each offset two studs along X and raised one brick,
  # chained by interface mating.
  staircase:
    type: assy
    path: staircase.assy
    manufacturable: false

  # Different sizes joined into an arch: a 2x4 base, two 2x2 pillars, and a 2x4
  # brick bridging across both pillars.
  mixed:
    type: assy
    path: mixed.assy
    manufacturable: false

  # Bricks + plate + tile: a 2x4 base carries two 2x2 bricks, a 2x4 plate bridges
  # across both, and a 2x2 tile caps it. (Uses the Plate and Tile LDraw
  # categories, whose full catalogs the plugin enumerates and caches on first
  # use, so the first build of this assembly is slow.)
  pyramid:
    type: assy
    path: pyramid.assy
    manufacturable: false

  # The Technic interfaces: a pin joining a beam to a Technic brick, and an axle
  # driven through an axle-hole brick that sits on that same brick's studs.
  # (Uses the Technic LDraw category, whose full catalog the plugin enumerates
  # and caches on first use, so the first build of this assembly is slow.)
  technic:
    type: assy
    path: technic.assy
    manufacturable: false

  # A gear train: an 8-tooth and a 16-tooth gear meshed onto a 24-tooth one,
  # placed by naming a tooth and a gap rather than a centre distance.
  gears:
    type: assy
    path: gears.assy
    manufacturable: false

  # A minifig, stacked out of its own two joints with the head turned. (Uses
  # the Minifig LDraw category, which the plugin enumerates on first use.)
  minifig:
    type: assy
    path: minifig.assy
    manufacturable: false
