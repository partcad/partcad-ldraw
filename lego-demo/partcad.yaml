# LEGO interfaces demo -- generated by tmp/gen_demo.py (see README.md).
#
# Enriches common LDraw LEGO bricks (served by the //pub/universe/lego plugin)
# with a LEGO stud (male) / anti-stud (female) interface pair, placed at the
# exact stud coordinates read from the LDraw .dat files, so the bricks connect
# stud->anti-stud on the 8 mm grid via `connect:` in the .assy files.
#
# Coordinates are in PartCAD meshed part-space mm: (LDraw x, -y, z) * 0.4, so
# +Y is up. A brick body is 9.6 mm tall (bottom plane y = -9.6); a plate/tile is
# 3.2 mm (y = -3.2). Studs sit on the top plane (y = 0).
name: //pub/universe/lego/lego-demo
desc: |
  A demonstration test bench that enriches common LEGO bricks from the LDraw
  package with stud/anti-stud interfaces and mates them in assemblies.
  Authored by following the /pc:add-interfaces skill.

  This package is a sub-package of //pub/universe/lego (the LDraw package), so
  //pub/universe/lego/ldraw/<Category>:<id> parts resolve directly. Run pc from
  the repository root and address these objects as lego-demo:<name>.

sketches:
  # Stud footprint (Ø 4.8 mm) used to visualise the ports.
  lego-stud-sketch:
    type: basic
    circle: 2.4

interfaces:
  lego-stud:
    desc: |
      A LEGO stud (male connector). Its Z axis points up (+Y in the meshed
      frame), out of the top surface of the brick.
    ports:
      stud:
        sketch: lego-stud-sketch
    mates:
      lego-anti-stud:
        # The stud seats fully into the anti-stud; the stacking height is
        # already encoded in the anti-stud port's y-position (the part's own
        # bottom plane), so no travel is needed along Z.
        moveZ:
          min: 0
          max: 0
          default: 0
  lego-anti-stud:
    desc: |
      A LEGO anti-stud receptacle (female connector) on the underside of a
      brick. Its Z axis points down (-Y), into the opening that receives a stud.
    ports:
      anti:
        sketch: lego-stud-sketch

parts:
  brick-1x1:
    type: enrich
    source: //pub/universe/lego/ldraw/Brick:3005
    desc: LDraw 3005 (brick-1x1) with LEGO stud/anti-stud interfaces
    implements:
      //pub/universe/lego/lego-demo:lego-stud:
        c0r0: [[0, 0, 0], [1, 0, 0], 270]
      //pub/universe/lego/lego-demo:lego-anti-stud:
        c0r0: [[0, -9.6, 0], [1, 1, -1], 120]

