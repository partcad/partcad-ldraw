assemblies:
  # A clean two-brick stack: two 2x4 bricks mated stud->anti-stud, perfectly
  # aligned, so the column is exactly two brick-heights (19.2 mm) tall.
  stack:
    type: assy
    path: stack.assy
    manufacturable: false

  # A four-step staircase built from 1x4 bricks, each offset two studs along X
  # and raised one brick, connected purely by interface mating.
  staircase:
    type: assy
    path: staircase.assy
    manufacturable: false

  # Different sizes joined into an arch: a 2x4 base, two 2x2 pillars, and a 2x4
  # bridge across both pillars.
  mixed:
    type: assy
    path: mixed.assy
    manufacturable: false

  # Bricks + plate + tile: a 2x4 base carries two 2x2 bricks (left and right),
  # a 2x4 plate bridges across both, and a 2x2 tile caps it. Uses the Plate and
  # Tile LDraw categories, whose full catalogs the plugin enumerates (and caches)
  # on first use, so the very first build of this assembly is slow.
  pyramid:
    type: assy
    path: pyramid.assy
    manufacturable: false
