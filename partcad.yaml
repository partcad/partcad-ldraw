# PartCAD package: the LDraw parts library as an external repository.
#
# Published as //pub/universe/lego/ldraw: this package is //pub/universe/lego
# and its single external dependency 'ldraw' is the library root, whose children
# (served by the ldraw_repo plugin) are the LDraw categories. Each category
# holds parts of type ':ldraw' (see the 'ldraw' partType and ldraw.py).
name: //pub/universe/lego

desc: |
  The LDraw parts library (https://library.ldraw.org) exposed as parametric
  PartCAD parts. Categories, part lists and part metadata are fetched from
  ldraw.org on demand and cached; part geometry is meshed from the LDraw .dat
  files on render. An index of part names ships with the package; no geometry
  is vendored.
url: https://library.ldraw.org/

# Requires the first PartCAD release that reads 'colors:', 'materials:' with
# 'ids' and 'finishes:' - LEGO's colours, below - and converts what a part type
# says its faces are in by them (see "Colours" in the README). It also takes
# 'turnZ' in an assembly's 'map:', which the plugin uses for a shortcut whose
# part's port is the shortcut's turned about its axis, and reads the plugin's
# own CACHE_VERSION, so this package states no 'cacheVersion' of its own.
partcad: ">=0.8.274"

docs:
  name: LDraw for PartCAD
  usage: |
    ```shell
    pc list packages //pub/universe/lego/ldraw
    pc list parts //pub/universe/lego/ldraw/Brick
    pc inspect //pub/universe/lego/ldraw/Brick:3001
    ```

dependencies:
  # The LDraw library root. Its children (the categories) are reported by the
  # plugin's 'deps', so this one dependency yields the whole category tree.
  ldraw:
    type: external
    plugin: :ldraw_repo
    desc: The LDraw parts library, with one sub-package per category.

repositories:
  ldraw_repo:
    type: basic
    path: ldraw_repo.py
    desc: Serves LDraw categories and parts, fetching from ldraw.org on demand.

partTypes:
  # The ':ldraw' part type: a wrapper that meshes an LDraw .dat into a shape.
  # Also served by the plugin for each category sub-package, so ':ldraw' parts
  # there resolve; declared here too for standalone use of the root package.
  ldraw:
    kind: wrapper
    path: ldraw.py

sketches:
  # The stud footprint (LEGO stud is 4.8 mm in diameter), used to visualise the
  # stud / anti-stud ports.
  stud-sketch:
    type: basic
    circle: 2.4

  # The Technic footprint, used to visualise the pin / hole / axle ports. A
  # Technic pin is 4.8 mm across and an axle's cross section is inscribed in the
  # same circle, so one outline serves both; a "basic" sketch is a single
  # outline, and the cross itself is not one.
  technic-sketch:
    type: basic
    circle: 2.4

  # A Duplo stud is twice the system one across: 9.6 mm.
  duplo-stud-sketch:
    type: basic
    circle: 4.8

  # A minifig neck / waist stud, 4.8 mm across like a system stud but drawn
  # separately because it is a different connection.
  minifig-sketch:
    type: basic
    circle: 2.4

  # One tooth of a Technic gear, at the pitch circle: 4 mm of arc by the 8 mm
  # the gear is thick.
  gear-tooth-sketch:
    type: basic
    rectangle:
      side-x: 4.0
      side-y: 8.0

  # The mouth of an RJ12 socket / the shoulder of its plug (10 x 4.6 mm).
  rj12-sketch:
    type: basic
    rectangle:
      side-x: 10.0
      side-y: 4.6

  # A wheel or tyre is placed on its own axis, so its port is drawn as the
  # 4.8 mm circle every axis in this package is drawn with.
  wheel-sketch:
    type: basic
    circle: 2.4

interfaces:
  # The LEGO connection: a stud (male) mates the anti-stud recess (female) of the
  # part above it. The plugin (ldraw_repo.py) attaches these to every rectangular
  # Brick / Plate / Tile it serves, one instance per stud, at coordinates derived
  # from the part's "<type> A x B" name.
  #
  # Coordinates are in the meshed part-space (the wrapper meshes each .dat as
  # (x, -z, -y) * 0.4, which is LDraw's -Y up turned onto PartCAD's +Z, so a
  # part stands up the way every other PartCAD part does). A stud port's Z
  # points up (+Z) out of the top plane (z = 0); an anti-stud port's Z points
  # down (-Z) into the part's bottom plane (z = -9.6 mm for a brick, -3.2 mm
  # for a plate or tile). With that
  # pairing the 180-degree mate flip about [1,1,0] cancels the rotation, so the
  # upper part is translated by exactly stud_pos - anti_stud_pos: aligned studs
  # stack cleanly and a different stud gives an 8 mm-grid offset.
  stud:
    desc: A LEGO stud (male). Its Z axis points up (+Z), out of the top surface.
    ports:
      stud:
        sketch: stud-sketch
    # The stud seats fully, and the stacking height is carried by the anti-stud
    # port's y (the part's own bottom plane), so the connection has no freedom to
    # declare. It could not be declared here in any case: PartCAD reads only the
    # description and the port selectors out of a mate, so a parameter written
    # here would be silently ignored rather than settable from an assembly.
    # Freedom that is real goes under 'parameters', as the Technic ones below do.
    mates: anti-stud
    # The same turn the anti-stud states, from this side. A connection names one
    # of the two interfaces and reads the parameters off that one, so a part
    # joined by its stud - which is what an assembly does when it puts a brick
    # in underneath something already placed - could not say it was turned at
    # all, and there is nothing about a stud that makes it the fixed half of the
    # pair. Note that the two run opposite ways round, because each interface's
    # Z points into its own part.
    parameters:
      turnZ:
        min: -180
        max: 180
        default: 0
        type: turn
        dir: [0, 0, 1]
    # One stud in one anti-stud turns freely about the stud: a 1 x 1 plate on a
    # single stud spins. It takes a second stud to hold an angle, and that is a
    # property of the pair of connections, not of this one.
    motion:
      type: continuous
      axis: [0, 0, 1]
  anti-stud:
    desc: >-
      A LEGO anti-stud recess (female) on the underside of a part. Its Z axis
      points down (-Z), into the opening that receives a stud.
    ports:
      anti:
        sketch: stud-sketch
    # The executable counterpart of the 'motion' below, and the reason it is on
    # this side of the pair: the part that travels is the one being put on, and
    # it is its anti-stud that meets the stud already there. A 1 x 1 plate on a
    # single stud really does spin, so a model that lays a brick across the one
    # under it is describing the joint it has rather than working around one it
    # has not - and without this there is no way to say so, since PartCAD reads
    # only a description and port selectors out of a mate (see 'stud' above).
    #
    # Quarter turns are what a rectangular brick uses, but the range is the full
    # circle: a round part on one stud sits at any angle, and a limit at 90
    # would be this interface deciding that for every part that implements it.
    parameters:
      turnZ:
        min: -180
        max: 180
        default: 0
        type: turn
        dir: [0, 0, 1]
    motion:
      type: continuous
      axis: [0, 0, 1]

  # --- Technic ---------------------------------------------------------------
  #
  # The other half of the LEGO system: round pin holes, cross-shaped axle holes,
  # and the pins and axles that go into them. The plugin attaches these to the
  # Technic bricks, beams, axles and pins it serves, at coordinates derived from
  # each part's name (see "_technic_implements" in ldraw_repo.py).
  #
  # A Technic hole is 4.8 mm across and goes right through a part that is one
  # stud (8 mm) thick, so it has two mouths and a part carries one instance per
  # mouth. As with the studs above, a port sits on the surface where the two
  # parts touch, with its Z axis pointing out of its own part, so that the mate
  # flip brings the two together instead of turning one of them around.
  technic-pin-hole:
    desc: >-
      A round Technic hole, 4.8 mm across, as found in a Technic brick or a
      beam. One instance per mouth of the hole; the Z axis of each points out of
      the part along the axis of the hole.
    ports:
      hole:
        sketch: technic-sketch
    parameters:
      # What is left free once a pin is in: a pin in a round hole turns. (A pin
      # "with Friction" turns too - it just holds the angle it is left at.)
      turnZ:
        min: -180
        max: 180
        default: 0
        type: turn
        dir: [0, 0, 1]
      # An axle in a round hole also slides; a pin's collar stops it, so this
      # says nothing about pins. See 'technic-axle' below.
      moveZ:
        min: -256
        max: 256
        default: 0
        type: move
        dir: [0, 0, 1]
    motion:
      type: continuous
      axis: [0, 0, 1]
    # A round hole takes an axle too, and lets it spin: that is what makes an
    # axle through a beam an axle rather than a pin. Declared here rather than
    # on 'technic-axle' because an interface states one mate, and the axle's own
    # is the cross hole that drives it.
    mates: technic-axle

  technic-pin:
    desc: >-
      One end of a Technic pin. The port sits on the plane of the pin's collar -
      what stops the pin and rests against the face of the part it goes into -
      with its Z axis pointing out along the pin, the way the pin travels in.
    ports:
      pin:
        sketch: technic-sketch
    parameters:
      turnZ:
        min: -180
        max: 180
        default: 0
        type: turn
        dir: [0, 0, 1]
    # The collar seats against the face, so the depth is not free: a pin either
    # is in the hole or is not.
    mates:
      technic-pin-hole:
        # A Technic pin is slotted and ridged at each end, and it goes in by
        # squeezing the slot shut past the lip of the hole, which it then springs
        # open behind. A model holds no springs, so it holds the ridge inside the
        # lip, and PartCAD's interference test is told that this overlap is the
        # joint rather than a fault. Nothing else about a pin excuses one: a pin
        # that also reaches into a part it is not joined to still shows.
        #
        # Said of the pairing and not of either interface: an axle goes into the
        # same round hole and snaps past nothing.
        snapIn: true
    # The same freedom the hole states from its side.
    motion:
      type: continuous
      axis: [0, 0, 1]

  technic-axle-hole:
    desc: >-
      A cross-shaped Technic axle hole. One instance per mouth of the hole; the
      Z axis of each points out of the part along the axis of the hole. An axle
      in it slides but cannot turn.
    ports:
      hole:
        sketch: technic-sketch
    parameters:
      # Where the axle sits along the hole; see 'technic-axle' below.
      moveZ:
        min: -256
        max: 256
        default: 0
        type: move
        dir: [0, 0, 1]
    motion:
      type: prismatic
      axis: [0, 0, 1]

  technic-axle:
    desc: >-
      One end of a Technic axle. Its Z axis points along the axle towards the
      other end, so connecting it puts that end in the mouth of a hole and lays
      the shaft through it; 'moveZ' is how much further the axle is pushed in.
    ports:
      axle:
        sketch: technic-sketch
    parameters:
      # An axle is held by nothing along its length, so where it sits in the
      # hole is free: 0 leaves the end of the axle in the mouth of the hole,
      # a positive value drives it further through and a negative one draws it
      # back out. The bound is the longest axle LDraw has (32L, 256 mm); the
      # real limit is the length of the axle in hand.
      moveZ:
        min: -256
        max: 256
        default: 0
        type: move
        dir: [0, 0, 1]
    # The cross hole is what drives an axle; the round hole it also fits is
    # declared by 'technic-pin-hole' above.
    mates: technic-axle-hole
    # An axle carries whatever is threaded onto it - the beams it runs through,
    # bushes, gears and a wheel on the same end - and each of them is joined to
    # that end at its own 'moveZ'. One end taking several parts is what an axle
    # is for, so PartCAD's connectivity test is told not to report it.
    multiConnect: true

  # --- Duplo ------------------------------------------------------------------
  #
  # The same connection as a stud, at twice the size: a 16 mm grid on a body
  # 19.2 mm tall, with 9.6 mm studs. It is a separate pair of interfaces rather
  # than a parameter of the system stud because the two do not mate: a Duplo
  # stud does not fit a system anti-stud.
    # An axle slides through a cross hole and is driven by it rather than
    # turning in it, so the freedom left is along the axle, not about it.
    motion:
      type: prismatic
      axis: [0, 0, 1]
  duplo-stud:
    desc: >-
      A Duplo stud (male), 9.6 mm across on a 16 mm grid. Its Z axis points up
      (+Z), out of the top surface.
    ports:
      stud:
        sketch: duplo-stud-sketch
    mates: duplo-anti-stud
    motion:
      type: continuous
      axis: [0, 0, 1]
  duplo-anti-stud:
    desc: >-
      A Duplo anti-stud recess (female) on the underside of a Duplo part. Its Z
      axis points down (-Z), out of the opening that receives a stud.
    ports:
      anti:
        sketch: duplo-stud-sketch
    motion:
      type: continuous
      axis: [0, 0, 1]

  # --- Minifig ----------------------------------------------------------------
  #
  # A minifig is a stack of four parts with two joints of its own between them,
  # and an ordinary stud at the top of the head that carries the hat or hair.
  # Both joints turn: a minifig's head and legs are meant to be posed.
  minifig-neck:
    desc: >-
      The neck stud on top of a minifig torso (male). Its Z axis points up (+Z),
      out of the shoulder plane the head's rim rests on.
    ports:
      neck:
        sketch: minifig-sketch
    parameters:
      # A minifig head turns on its neck. So does the torso on its hips below.
      turnZ:
        min: -180
        max: 180
        default: 0
        type: turn
        dir: [0, 0, 1]
    mates: minifig-neck-socket
    motion:
      type: continuous
      axis: [0, 0, 1]
  minifig-neck-socket:
    desc: >-
      The socket under a minifig head (female). Its Z axis points down (-Z), out
      of the opening that receives the neck.
    ports:
      neck:
        sketch: minifig-sketch
    parameters:
      turnZ:
        min: -180
        max: 180
        default: 0
        type: turn
        dir: [0, 0, 1]
    # A minifig head turns all the way round on its neck.
    motion:
      type: continuous
      axis: [0, 0, 1]

  minifig-waist:
    desc: >-
      The waist stud on top of a pair of minifig hips (male). Its Z axis points
      up (+Z), out of the plane the torso sits on.
    ports:
      waist:
        sketch: minifig-sketch
    parameters:
      turnZ:
        min: -180
        max: 180
        default: 0
        type: turn
        dir: [0, 0, 1]
    mates: minifig-waist-socket
    motion:
      type: continuous
      axis: [0, 0, 1]
  minifig-waist-socket:
    desc: >-
      The opening in the bottom of a minifig torso (female). Its Z axis points
      down (-Z), out of the opening that receives the waist.
    ports:
      waist:
        sketch: minifig-sketch
    parameters:
      turnZ:
        min: -180
        max: 180
        default: 0
        type: turn
        dir: [0, 0, 1]
    motion:
      type: continuous
      axis: [0, 0, 1]

  # --- Gears ------------------------------------------------------------------
  #
  # A gear mesh is a port pair like any other, once a tooth and a gap are each
  # taken to be a port: a tooth of one gear sits in a gap of the other. Every
  # port is on the gear's pitch circle - radius 0.5 mm per tooth, so a 24-tooth
  # gear has a 12 mm one - with its Z axis pointing radially outwards. Bringing
  # a tooth port and a gap port together therefore separates the two gears by
  # the sum of their pitch radii, which is exactly the centre distance the pair
  # is cut for, and lines their teeth up in the bargain.
  gear-tooth:
    desc: >-
      One tooth of a Technic gear, at the pitch circle, Z pointing outwards.
      Instances are named t<i>, numbered anticlockwise from the +X axis.
    ports:
      tooth:
        sketch: gear-tooth-sketch
    # The two are the same connection seen from either side, so the mate is
    # stated once, here.
    mates: gear-gap
    # A meshed pair turns: each gear about its own axle, and the two coupled by
    # the mesh. PartCAD states a joint one interface at a time, so what is said
    # here is the turn this contact leaves free; the coupling between the two
    # gears is what 'mimic' is for, once a connection can name the other joint.
    # The axle is [1, 1, 0] in a tooth port's own frame, and the same in every
    # tooth's - that constancy is what makes this frame the right one.
    motion:
      type: continuous
      axis: [0.7071068, 0.7071068, 0]
  gear-gap:
    desc: >-
      One gap between two teeth of a Technic gear, at the pitch circle, Z
      pointing outwards. Instances are named g<i>, the gap anticlockwise of
      tooth t<i>.
    ports:
      gap:
        sketch: gear-tooth-sketch
    motion:
      type: continuous
      axis: [0.7071068, 0.7071068, 0]

  # --- Wheels -----------------------------------------------------------------
  #
  # A tyre goes on a wheel concentrically, and LDraw draws the pair sharing one
  # origin, so both ports sit on the part's own origin with their Z along the
  # axle. The instance carries the nominal fitting diameter from the part's name
  # ("d30"), so an assembly names the size it means and a mismatched pair is
  # visible in the ASSY file - PartCAD gates compatibility by interface, not by
  # dimension, so it cannot reject one for you.
  wheel-rim:
    desc: >-
      The rim of a wheel that a tyre is fitted to (male). One instance, on the
      wheel's own axis, named for the wheel's nominal diameter in mm.
    ports:
      rim:
        sketch: wheel-sketch
    mates: tyre-bore
    # A tyre on a rim does not turn on it; the pair turns on an axle instead.
    motion:
      type: fixed
  tyre-bore:
    desc: >-
      The bore of a tyre, which fits over a wheel's rim (female). One instance,
      on the tyre's own axis, named for its nominal fitting diameter in mm.
    ports:
      bore:
        sketch: wheel-sketch
    motion:
      type: fixed

  # --- Mindstorms wiring ------------------------------------------------------
  #
  # The one connection the Mindstorms parts have that is theirs rather than
  # Technic's: the RJ12-style plug on a cable and the socket on a brick, motor
  # or sensor. Mechanically it is a plug in a hole like any other - the plug's
  # shoulder stops against the face of the socket - so it is a port pair, even
  # though what travels through it is a signal rather than a load.
  rj12-plug:
    desc: >-
      The plug on the end of a Mindstorms cable (male). Its port is the shoulder
      the socket stops it at, with Z pointing the way it goes in.
    ports:
      plug:
        sketch: rj12-sketch
    mates: rj12-socket
    # A plug in its socket is held by the latch and does not move in it.
    motion:
      type: fixed
  rj12-socket:
    desc: >-
      A Mindstorms cable socket (female), on a brick, a motor or a sensor. Its
      port is the mouth of the socket, with Z pointing out of the part.
    ports:
      socket:
        sketch: rj12-sketch
    motion:
      type: fixed

# How the 'ldraw' part type's colour codes are read: looked up among the
# colours, materials and finishes below by their 'ids: {ldraw: ...}'. The part
# type names this convention by reference, which is what puts the declarations
# of this package in scope for the parts it builds in the categories below it.
cmfConventions:
  ldraw:
    desc: LDraw's colour codes, as the 'ldraw' part type states them, by LEGO's colours here.
    extends: ldraw

# LEGO's colours, and the materials and finishes LDraw's colour codes imply:
# what a part's faces are drawn in, and what a model names its parts' colours
# by ('//pub/universe/lego:Medium Stone Grey', or an alias of its own for it).
# A colour LEGO makes is a claim that it can be had ('manufacturable', the
# default); one LDraw draws and LEGO has no id for draws, and claims nothing.
# Written by build_colors.py from LDraw's LDConfig.ldr - run it again rather
# than editing these by hand.
# BEGIN generated by build_colors.py from LDraw's LDConfig.ldr - do not edit by hand
colors:
