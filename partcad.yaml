# PartCAD package: the LDraw parts library as an external repository.
#
# Published as //pub/universe/lego/ldraw: this package is //pub/universe/lego
# and its single external dependency 'ldraw' is the library root, whose children
# (served by the ldraw_repo plugin) are the LDraw categories. Each category
# holds parts of type ':ldraw' (see the 'ldraw' partType and ldraw.py).
name: //pub/universe/lego

desc: |
  The LDraw parts library (https://library.ldraw.org) exposed as parametric
  PartCAD parts. Categories, part lists and part metadata are fetched from
  ldraw.org on demand and cached; part geometry is meshed from the LDraw .dat
  files on render. Nothing is vendored.
url: https://library.ldraw.org/

# Requires the PartCAD version that introduced partTypes and plugin-backed
# (external) packages.
partcad: ">=0.7.146"

docs:
  name: LDraw for PartCAD
  usage: |
    ```shell
    pc list packages //pub/universe/lego/ldraw
    pc list parts //pub/universe/lego/ldraw/Brick
    pc inspect //pub/universe/lego/ldraw/Brick:3001
    ```

dependencies:
  # The LDraw library root. Its children (the categories) are reported by the
  # plugin's 'deps', so this one dependency yields the whole category tree.
  ldraw:
    type: external
    plugin: :ldraw_repo
    desc: The LDraw parts library, with one sub-package per category.
    # Bump whenever ldraw_repo.py changes the shape of the data it returns, so
    # stale entries cached by an older plugin are invalidated. v1 added the LEGO
    # stud / anti-stud interfaces to every Brick / Plate / Tile config.
    cacheVersion: 1

repositories:
  ldraw_repo:
    type: basic
    path: ldraw_repo.py
    desc: Serves LDraw categories and parts, fetching from ldraw.org on demand.

partTypes:
  # The ':ldraw' part type: a wrapper that meshes an LDraw .dat into a shape.
  # Also served by the plugin for each category sub-package, so ':ldraw' parts
  # there resolve; declared here too for standalone use of the root package.
  ldraw:
    kind: wrapper
    path: ldraw.py

sketches:
  # The stud footprint (LEGO stud is 4.8 mm in diameter), used to visualise the
  # stud / anti-stud ports.
  stud-sketch:
    type: basic
    circle: 2.4

interfaces:
  # The LEGO connection: a stud (male) mates the anti-stud recess (female) of the
  # part above it. The plugin (ldraw_repo.py) attaches these to every rectangular
  # Brick / Plate / Tile it serves, one instance per stud, at coordinates derived
  # from the part's "<type> A x B" name.
  #
  # Coordinates are in the meshed part-space (the wrapper meshes each .dat as
  # (x, -y, z) * 0.4, so +Y is up). A stud port's Z points up (+Y) out of the top
  # plane (y = 0); an anti-stud port's Z points down (-Y) into the part's bottom
  # plane (y = -9.6 mm for a brick, -3.2 mm for a plate or tile). With that
  # pairing the 180-degree mate flip about [1,1,0] cancels the rotation, so the
  # upper part is translated by exactly stud_pos - anti_stud_pos: aligned studs
  # stack cleanly and a different stud gives an 8 mm-grid offset.
  stud:
    desc: A LEGO stud (male). Its Z axis points up (+Y), out of the top surface.
    ports:
      stud:
        sketch: stud-sketch
    mates:
      anti-stud:
        # The stud seats fully; the stacking height is carried by the anti-stud
        # port's y (the part's own bottom plane), so no travel along Z is needed.
        moveZ:
          min: 0
          max: 0
          default: 0
  anti-stud:
    desc: >-
      A LEGO anti-stud recess (female) on the underside of a part. Its Z axis
      points down (-Y), into the opening that receives a stud.
    ports:
      anti:
        sketch: stud-sketch
